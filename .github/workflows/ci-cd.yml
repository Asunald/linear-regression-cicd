name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: pip install pandas scikit-learn joblib

      - name: Train and Create File
        run: |
          python train_model.py
          # 强制检查文件是否存在，不存在就报错，不往下走
          ls -l linear_model.txt 

      - name: Force Update Release Branch
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout --orphan temp_release
          git rm -rf .
          # 这一步非常关键：直接从当前运行环境把刚生成的文件拿过来
          git checkout main -- training_data.csv 2>/dev/null || echo "skip"
          cp ../linear_model.txt . 2>/dev/null || cp /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/linear_model.txt .
          git add .
          git commit -m "Auto-update model"
          git push origin temp_release:release --force

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          files: linear_model.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}